<!-- Create a basic HTML structure with the following elements:
● The question text.
● Four buttons for answer choices.
● An element to display feedback after an answer is selected.
● A “Next Question” button to move onto the next question. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Big Quiz</title>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Simple Quiz</h1>
    </header>

    <section>
        <p id="main-question"></p>

        <button class="answers"></button>
        <button class="answers"></button>
        <button class="answers"></button>
        <button class="answers"></button>

        <p id="feedback"></p>

        <button id="next-button">Next</button>
    </section>

    <footer>
        &copy; Josh L. 2025
    </footer>
</body>
</html>
